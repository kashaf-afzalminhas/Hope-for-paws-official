name: Deploy Backend to Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: tauris-dep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -e
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION MONGODB_URI JWT_EXPIRE FRONTEND_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub Actions secret: ${v}"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Install Serverless
        # Use Serverless v3 to avoid the v4+ license/login requirement in CI
        run: npm install -g serverless@3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: serverless deploy
