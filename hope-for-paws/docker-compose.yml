version: '3.8'

services:
  # MongoDB service (for local development)
  mongodb:
    image: mongo:6.0
    container_name: hope-for-paws-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: hopeforpaws
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - hope-for-paws-network

  # Redis service (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: hope-for-paws-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hope-for-paws-network

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hope-for-paws-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/hopeforpaws?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-key-here
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      EMAIL_USER: your-email@gmail.com
      EMAIL_PASS: your-app-password
      CLOUDINARY_CLOUD_NAME: your-cloudinary-name
      CLOUDINARY_API_KEY: your-cloudinary-key
      CLOUDINARY_API_SECRET: your-cloudinary-secret
    volumes:
      - ./uploads:/app/backend/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - hope-for-paws-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: hope-for-paws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - hope-for-paws-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  hope-for-paws-network:
    driver: bridge 